<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Test WebSocket Chat (STOMP + JWT)</title>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@6/bundles/stomp.umd.min.js"></script>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        max-width: 640px;
        margin: 40px auto;
        background: #f4f6f8;
        color: #222;
    }
    h2 { text-align: center; }
    .card {
        background: #fff;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        margin-bottom: 16px;
    }
    input[type=text], input[type=password] {
        width: 100%;
        padding: 8px 10px;
        margin: 6px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
    }
    button {
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        background: #2b6cb0;
        color: #fff;
        cursor: pointer;
        font-size: 14px;
        margin-top: 6px;
    }
    button:hover { background: #245a94; }
    button:disabled { background: #aaa; cursor: not-allowed; }

    #chat { display: none; }
    #status {
        font-size: 13px;
        padding: 6px 10px;
        border-radius: 4px;
        margin-bottom: 10px;
        display: inline-block;
    }
    .status-ok { background: #d1f7d6; color: #1a7d2b; }
    .status-err { background: #fddede; color: #a10e0e; }
    .status-pending { background: #fff4d1; color: #8a6d00; }

    #messages {
        border: 1px solid #ddd;
        background: #fafafa;
        height: 280px;
        overflow-y: auto;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 10px;
        font-size: 14px;
    }
    .msg-join { color: #888; font-style: italic; margin: 4px 0; }
    .msg-chat { margin: 4px 0; }
    .msg-chat .sender { font-weight: bold; color: #2b6cb0; }
    .msg-private { margin: 4px 0; background: #fff0f6; padding: 4px 8px; border-radius: 4px; }
    .msg-private .sender { font-weight: bold; color: #b0246c; }
    .msg-error { color: #a10e0e; font-weight: bold; margin: 4px 0; }

    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }
    .row button { white-space: nowrap; }

    .section-title { font-size: 13px; color: #666; margin: 14px 0 4px; text-transform: uppercase; letter-spacing: .5px; }
    #logout { float: right; background: #999; }
</style>
</head>
<body>

<h2>🧪 Test WebSocket Chat (STOMP)</h2>

<!-- ============ LOGIN FORM ============ -->
<div class="card" id="login">
    <h3>Đăng nhập</h3>
    <div id="loginStatus"></div>
    <input type="text" id="loginUsername" placeholder="Username" autocomplete="username">
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" onclick="login()">Đăng nhập &amp; Vào phòng chat</button>
    <p style="font-size:12px;color:#888;">
        Endpoint gọi: <code>POST /api/auth/login</code><br>
        Nếu backend chưa có xác thực JWT, bạn có thể bỏ qua và dùng nút bên dưới để test nhanh không cần login.
    </p>
    <button style="background:#666;" onclick="connectWithoutAuth()">Vào chat không cần login (test nhanh)</button>
</div>

<!-- ============ CHAT ROOM ============ -->
<div class="card" id="chat">
    <div>
        <span id="status" class="status-pending">Chưa kết nối</span>
        <button id="logout" onclick="disconnect()">Rời phòng</button>
    </div>

    <div id="messages"></div>

    <div class="section-title">Tin nhắn công khai</div>
    <div class="row">
        <input type="text" id="messageInput" placeholder="Nhập tin nhắn..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Gửi</button>
    </div>

    <div class="section-title">Tin nhắn riêng tư</div>
    <div class="row">
        <input type="text" id="receiverInput" placeholder="Tên người nhận">
        <input type="text" id="privateMessageInput" placeholder="Nội dung riêng tư" onkeypress="if(event.key==='Enter') sendPrivateMessage()">
        <button onclick="sendPrivateMessage()">Gửi riêng</button>
    </div>
</div>

<script>
    // ======= CẤU HÌNH — chỉnh lại nếu backend chạy port/host khác =======
    const API_BASE = 'http://localhost:8080';
    const WS_URL = 'http://localhost:8080/ws';

    let stompClient = null;
    let username = null;
    let authToken = null;

    // ---------- LOGIN (gọi API JWT) ----------
    async function login() {
        const u = document.getElementById('loginUsername').value.trim();
        const p = document.getElementById('loginPassword').value.trim();
        const statusEl = document.getElementById('loginStatus');

        if (!u || !p) {
            statusEl.innerHTML = '<div class="msg-error">Vui lòng nhập đủ username/password</div>';
            return;
        }

        document.getElementById('loginBtn').disabled = true;
        statusEl.innerHTML = '<div>Đang đăng nhập...</div>';

        try {
            const res = await fetch(API_BASE + '/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });

            if (!res.ok) {
                throw new Error('HTTP ' + res.status);
            }

            const data = await res.json();
            authToken = data.token;
            username = u;

            statusEl.innerHTML = '<div style="color:green;">Đăng nhập thành công!</div>';
            enterChatRoom(WS_URL + '?token=' + encodeURIComponent(authToken));

        } catch (err) {
            statusEl.innerHTML = '<div class="msg-error">Đăng nhập thất bại: ' + err.message + '</div>';
            document.getElementById('loginBtn').disabled = false;
        }
    }

    // ---------- CONNECT KHÔNG CẦN LOGIN (test nhanh, dùng username thô) ----------
    function connectWithoutAuth() {
        const u = document.getElementById('loginUsername').value.trim() || ('guest-' + Math.floor(Math.random() * 1000));
        username = u;
        enterChatRoom(WS_URL + '?username=' + encodeURIComponent(u));
    }

    // ---------- VÀO PHÒNG CHAT ----------
    function enterChatRoom(fullWsUrl) {
        document.getElementById('login').style.display = 'none';
        document.getElementById('chat').style.display = 'block';
        setStatus('Đang kết nối...', 'pending');

        const socket = new SockJS(fullWsUrl);

        stompClient = new StompJs.Client({
            webSocketFactory: () => socket,
            heartbeatIncoming: 10000,
            heartbeatOutgoing: 10000,
            reconnectDelay: 5000,
            debug: () => {}, // đổi thành console.log nếu cần xem chi tiết frame STOMP

            onConnect: () => {
                setStatus('Đã kết nối — ' + username, 'ok');

                // Nhận tin nhắn công khai
                stompClient.subscribe('/topic/public', (msg) => {
                    showMessage(JSON.parse(msg.body));
                });

                // Nhận tin nhắn riêng tư gửi cho chính mình
                stompClient.subscribe('/user/queue/private', (msg) => {
                    const d = JSON.parse(msg.body);
                    showPrivateMessage(d, false);
                });

                // Nhận lỗi từ server (nếu có @MessageExceptionHandler trả về /user/queue/errors)
                stompClient.subscribe('/user/queue/errors', (msg) => {
                    appendLog('⚠️ Lỗi server: ' + msg.body, 'msg-error');
                });

                // Báo cho mọi người biết mình đã vào phòng
                stompClient.publish({
                    destination: '/app/chat.join',
                    body: JSON.stringify({ sender: username, type: 'JOIN' })
                });
            },

            onDisconnect: () => {
                setStatus('Mất kết nối, đang thử lại...', 'err');
            },

            onStompError: (frame) => {
                setStatus('Lỗi STOMP: ' + frame.headers['message'], 'err');
                appendLog('⚠️ ' + (frame.body || frame.headers['message']), 'msg-error');
            },

            onWebSocketClose: () => {
                setStatus('Kết nối đã đóng', 'err');
            }
        });

        stompClient.activate();
    }

    // ---------- GỬI TIN NHẮN CÔNG KHAI ----------
    function sendMessage() {
        const input = document.getElementById('messageInput');
        const content = input.value.trim();
        if (!content || !stompClient || !stompClient.connected) return;

        stompClient.publish({
            destination: '/app/chat.send',
            body: JSON.stringify({ sender: username, content: content, type: 'CHAT' })
        });
        input.value = '';
    }

    // ---------- GỬI TIN NHẮN RIÊNG TƯ ----------
    function sendPrivateMessage() {
        const receiver = document.getElementById('receiverInput').value.trim();
        const content = document.getElementById('privateMessageInput').value.trim();
        if (!receiver || !content || !stompClient || !stompClient.connected) return;

        const payload = { sender: username, receiver: receiver, content: content, type: 'PRIVATE' };

        stompClient.publish({
            destination: '/app/chat.private',
            body: JSON.stringify(payload)
        });

        // Hiện luôn ở phía người gửi (vì server chỉ gửi tới receiver, không echo lại)
        showPrivateMessage(payload, true);

        document.getElementById('privateMessageInput').value = '';
    }

    // ---------- HIỂN THỊ TIN NHẮN ----------
    function showMessage(message) {
        const messagesDiv = document.getElementById('messages');
        const el = document.createElement('div');

        if (message.type === 'JOIN' || message.type === 'LEAVE') {
            el.className = 'msg-join';
            el.innerText = message.content;
        } else {
            el.className = 'msg-chat';
            el.innerHTML = '<span class="sender">' + escapeHtml(message.sender) + ':</span> ' + escapeHtml(message.content);
        }

        messagesDiv.appendChild(el);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showPrivateMessage(message, isOutgoing) {
        const messagesDiv = document.getElementById('messages');
        const el = document.createElement('div');
        el.className = 'msg-private';

        if (isOutgoing) {
            el.innerHTML = '🔒 <span class="sender">Bạn → ' + escapeHtml(message.receiver) + ':</span> ' + escapeHtml(message.content);
        } else {
            el.innerHTML = '🔒 <span class="sender">' + escapeHtml(message.sender) + ' (riêng tư):</span> ' + escapeHtml(message.content);
        }

        messagesDiv.appendChild(el);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function appendLog(text, cssClass) {
        const messagesDiv = document.getElementById('messages');
        const el = document.createElement('div');
        el.className = cssClass || '';
        el.innerText = text;
        messagesDiv.appendChild(el);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function setStatus(text, kind) {
        const el = document.getElementById('status');
        el.innerText = text;
        el.className = kind === 'ok' ? 'status-ok' : (kind === 'err' ? 'status-err' : 'status-pending');
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.innerText = str;
        return div.innerHTML;
    }

    // ---------- RỜI PHÒNG ----------
    function disconnect() {
        if (stompClient) {
            stompClient.deactivate();
        }
        document.getElementById('chat').style.display = 'none';
        document.getElementById('login').style.display = 'block';
        document.getElementById('loginBtn').disabled = false;
        document.getElementById('messages').innerHTML = '';
        authToken = null;
        username = null;
    }
</script>
</body>
</html>
