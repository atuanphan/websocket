<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chat Room Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@6/bundles/stomp.umd.min.js"></script>
    <style>
        body { font-family: Arial; max-width: 500px; margin: 40px auto; }
        #chat { display: none; }
        #messages { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
        .join-msg { color: gray; font-style: italic; }
        .chat-msg .sender { font-weight: bold; }
    </style>
</head>
<body>

    <div id="login">
        <h3>Nhập tên để vào phòng chat</h3>
        <input type="text" id="username" placeholder="Tên của bạn">
        <button onclick="connect()">Vào phòng</button>
    </div>

    <div id="chat">
        <h3>Phòng chat</h3>
        <div id="messages"></div>
        <input type="text" id="messageInput" placeholder="Nhập tin nhắn" onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Gửi</button>
    </div>

    <script>
        let stompClient = null;
        let username = null;

        function connect() {
            username = document.getElementById('username').value.trim();
            if (!username) return;

            document.getElementById('login').style.display = 'none';
            document.getElementById('chat').style.display = 'block';

            const socket = new SockJS('http://localhost:8080/ws');
            stompClient = new StompJs.Client({
                webSocketFactory: () => socket,
                onConnect: () => {
                    stompClient.subscribe('/topic/messages', (msg) => {
                        showMessage(JSON.parse(msg.body));
                    });

                    // Báo cho server biết user này đã join
                    stompClient.publish({
                        destination: '/app/room/chat-join',
                        body: JSON.stringify({ sender: username, type: 'JOIN' })
                    });
                }
            });

            stompClient.activate();
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content || !stompClient) return;

            stompClient.publish({
                destination: '/app/room/chat-send',
                body: JSON.stringify({ sender: username, content: content, type: 'CHAT' })
            });
            input.value = '';
        }

        function showMessage(message) {
            const messagesDiv = document.getElementById('messages');
            const el = document.createElement('div');

            if (message.type === 'JOIN') {
                el.className = 'join-msg';
                el.innerText = message.content;
            } else {
                el.className = 'chat-msg';
                el.innerHTML = '<span class="sender">' + message.sender + ':</span> ' + message.content;
            }

            messagesDiv.appendChild(el);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
    </script>
</body>
</html>
