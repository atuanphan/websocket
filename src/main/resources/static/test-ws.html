<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test WebSocket STOMP</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@6/bundles/stomp.umd.min.js"></script>
</head>
<body>
    <h2>Test WebSocket (STOMP)</h2>
    <div id="status">Đang kết nối...</div>
    <br>
    <input type="text" id="messageInput" placeholder="Nhập tin nhắn">
    <button onclick="sendMessage()">Gửi</button>

    <h3>Log:</h3>
    <div id="log" style="border:1px solid #ccc; padding:10px; height:200px; overflow-y:auto;"></div>

    <script>
        const socket = new SockJS('http://localhost:8080/ws');
        const stompClient = new StompJs.Client({
            webSocketFactory: () => socket,
            debug: (str) => console.log(str),
            onConnect: () => {
                document.getElementById('status').innerText = 'Đã kết nối!';
                log('✅ Kết nối thành công');

                stompClient.subscribe('/topic/messages', (message) => {
                    log('📩 Nhận: ' + message.body);
                });
            },
            onStompError: (frame) => {
                log('❌ Lỗi: ' + frame.headers['message']);
            }
        });

        stompClient.activate();

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value;
            if (text.trim() === '') return;

            stompClient.publish({
                destination: '/app/sendMessage',
                body: text
            });
            log('📤 Gửi: ' + text);
            input.value = '';
        }

        function log(message) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += '<div>' + message + '</div>';
            logDiv.scrollTop = logDiv.scrollHeight;
        }
    </script>
</body>
</html>
